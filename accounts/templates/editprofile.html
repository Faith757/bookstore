
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest | Edit Profile</title>
    <link rel="stylesheet" href="{% static 'css/editprofile.css' %}">
</head>

<body>

<div class="profile-container">
    <h2 class="logo">Book<span>Nest.</span></h2>

    <h4>Edit Your Profile</h4>
    <p>Update your personal information below.</p>

    {% for message in messages %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>First Name</label>
            <input type="text" name="firstname"
                   value="{{ request.user.first_name }}" required>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" name="lastname"
                   value="{{ request.user.last_name }}" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email"
                   value="{{ request.user.email }}" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="phone"
                   value="{{ profile.phone }}">
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea name="address">{{ profile.address }}</textarea>
        </div>

        <button type="submit">Save Changes</button>
    </form>

    <p>
        <a href="{% url 'book' %}" class="back-link">Back to Books</a>
    </p>

</div>

</body>
</html>
