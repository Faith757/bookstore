{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest | Registration</title>
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h2>Book<span>Nest.</span></h2>
            <h1>Create an Account</h1>
            <p>Join BookNest and explore a world of books.</p>
                {% for message in messages %}
                    <p class="message {{ message.tags }}">{{ message }}</p>
                {% endfor %}
        </div>

        <form action="#" method="POST">
            {% csrf_token %}
            <div class="form-row">
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" name="firstname"
                           placeholder="Enter first name" required>
                </div>

                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" name="lastname"
                           placeholder="Enter last name" required>
                </div>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone"
                           placeholder="Enter phone number" required>
                </div>

                <div class="input-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Address</label>
                <textarea name="address"
                    placeholder="Enter the address you want your books to be delivered at."
                    rows="3" required></textarea>
            </div>

            <div class="terms">
                <input type="checkbox" required>
                <p>I agree to the Terms and Conditions.</p>
            </div>

            <button type="submit">Create Account</button>

            <div class="login-link">
                <p>Already have an account?
                    <a href="/accounts/login">Login here</a>
                </p>
            </div>

        </form>
    </div>
</body>
</html>
