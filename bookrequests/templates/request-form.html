{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest | Request a Book</title>
    <link rel="stylesheet" href="{% static 'css/request-form.css' %}">
</head>
<body>

    <div class="request-container">
        <div class="logo">Book<span>Nest.</span></div>
        <div class="form-header">
            <h2>Request a Book</h2>
            <p>Can't find the book you're looking for? Let us know.</p>
        </div>

            {% for message in messages %}
                <p class="message {{ message.tags }}">{{ message }}</p>
            {% endfor %}


        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.book_title.id_for_label }}">Book Title</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label for="{{ form.author.id_for_label }}">Category</label>
                {{ form.category }}
            </div>

            <button type="submit">Submit Request</button>
        </form>

        <a href="{% url 'book' %}" class="back-link">
            Back to Books
        </a>

    </div>

</body>
</html>
